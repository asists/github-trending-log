name: Weekly GitHub Trending

on:
  schedule:
    # 매주 일요일 21:07 UTC = 한국 시간 월요일 06:07
    # (GitHub 예약 실행은 수십 분 늦어질 수 있어 Claude 정리 시간보다 일찍 잡아 둠)
    - cron: "7 21 * * 0"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow"로 직접 실행 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch trending
        run: python scripts/fetch_trending.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data weekly
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "주간 트렌딩 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
